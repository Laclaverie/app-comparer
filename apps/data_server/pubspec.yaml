name: data_server
description: "Data server for price comparison database operations and business logic"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  # HTTP server framework
  shelf: ^1.4.0
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5
  
  # Database ORM and drivers
  sqlite3: ^2.4.0
  drift: ^2.26.1
  
  # JSON handling
  json_annotation: ^4.9.0
  
  # Path utilities
  path: ^1.9.1
  
  # Logging
  logging: ^1.2.0
  
  # Environment variables
  dotenv: ^4.2.0
  
  # HTTP client (for scraper integration)
  http: ^1.1.0

  # Images
  image: ^4.5.4
  
  shared_models:
    path: ../../packages/shared_models

dev_dependencies:
  # Testing
  test: ^1.24.0
  
  # Code generation
  build_runner: ^2.4.13  # ✅ CORRECTION : Même version que shared_models
  json_serializable: ^6.8.0  # ✅ CORRECTION : Même version
  drift_dev: ^2.26.1 
  
  # Linting
  lints: ^3.0.0